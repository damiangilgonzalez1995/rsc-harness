skill: to-tickets

should_trigger:
  - prompt: "Descompon este plan en tickets bala trazadora y publicalos."
    why: "Disparador directo de to-tickets."
  - prompt: "Convierte esta spec en un conjunto de tickets con bloqueos."
    why: "Disparador directo de to-tickets."
  - prompt: "Necesito tickets a partir de la conversacion actual."
    why: "Disparador directo de to-tickets."
  - prompt: "Break this spec down into tracer-bullet tickets in the tracker."
    why: "Disparador directo de to-tickets."
  - prompt: "Genera los tickets de este plan con sus dependencias."
    why: "Disparador directo de to-tickets."

should_not_trigger:
  - prompt: "Escribe la spec original antes de descomponerla."
    route_to: "to-spec"
    why: "Escribir la spec original es el trabajo de to-spec, no de to-tickets."
  - prompt: "Implementa uno de los tickets ya creados."
    route_to: "implement"
    why: "Implementar un ticket ya creado es el trabajo de implement, no de to-tickets."
  - prompt: "Revisa el codigo de un ticket cerrado."
    route_to: "code-review"
    why: "Revisar el codigo de un ticket cerrado es el trabajo de code-review, no de to-tickets."
  - prompt: "Interrogame sobre este plan antes de descomponerlo."
    route_to: "grilling"
    why: "Interrogar sobre el plan es el trabajo de grilling, no de to-tickets."

capability:
  - scenario: "El usuario quiere descomponer un plan en tickets publicados."
    must_include:
      - "ticket"
