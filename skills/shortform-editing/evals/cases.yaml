skill: shortform-editing

# This skill is the guided local reel editor: it checks what the project already has
# (tools, brand, recipe, references, raw clips) and records it in CLAUDE.md, installs the
# local tools only with consent, interviews the brand once, cuts silences, transcribes,
# shows a contact sheet before rendering, burns branded captions in the lower third,
# adds face-aware effects and animated resources, and exports 1080x1920 versions that
# never overwrite each other. It does NOT write the script or hook (video-shorts), build
# a Remotion codebase (remotion-video), schedule or publish (social-publisher), or write
# the upload copy and cover (shortform-packaging).

should_trigger:
  - prompt: "Edita el último vídeo de brutos."
    why: "The core ask in the person's words: a raw clip in reels/brutos/ becomes a finished reel (step 0 inventory, then step 3)."

  - prompt: "Ponle subtítulos con mis colores a este reel."
    why: "Branded captions burned in the lower third, colours from reels/marca/estilo.json — a signature move."

  - prompt: "Prepara el editor de reels en este proyecto."
    why: "Step 1: explain what gets installed (~3 GB in ~/.editor-video), ask permission, then install."

  - prompt: "Corrige: el gancho más grande."
    why: "Step 5: a correction becomes a new _vN version; the previous one is never overwritten."

  - prompt: "Quiero que mis reels se parezcan a estos tres vídeos de referencia: aprende mi marca."
    why: "Step 2: the brand interview plus reference analysis that writes docs/wiki/reels/marca.md and receta.md."

  - prompt: "Turn my raw talking-head clip into a finished vertical reel with captions and animated graphics."
    why: "English phrasing of the core job — raw vertical footage to a branded 1080x1920 reel."

  - prompt: "Els subtítols em tapen la cara, baixa'ls i torna a exportar el reel."
    why: "Catalan, symptom-first: captions over the face; the fix is the lower-third rule and a new version."

should_not_trigger:
  - prompt: "Escríbeme el guion y el gancho de un short de 30 segundos sobre el café."
    route_to: video-shorts
    why: "Words and a plan, no footage — the script and hook are authored elsewhere."

  - prompt: "Programa la publicación de este reel el martes a las 18:00 en Instagram y TikTok."
    route_to: social-publisher
    why: "Scheduling and publishing, not editing; this skill never uploads anything."

  - prompt: "Build a Remotion React project with a TransitionSeries I can render in CI."
    route_to: remotion-video
    why: "A React composition codebase, not a guided edit of the person's raw clip."

  - prompt: "Write the caption, hashtags and cover text for my finished Reel."
    route_to: shortform-packaging
    why: "Upload-form copy and cover for a finished short, not the edit."

capability:
  - scenario: "A content project with an empty reels/ layout, no tools installed and one raw talking-head clip in reels/brutos/. The person says «edita el último vídeo de brutos»."
    must_include:
      - "Starts with the inventory (node scripts/inventario.mjs ROOT), says in one line what exists and what is missing, and updates the ## Reels section of CLAUDE.md between its markers"
      - "Before installing, explains what will be downloaded and its size (~3 GB in ~/.editor-video) and asks for explicit permission; only then runs preparar with -Acepto / --acepto"
      - "Runs the brand interview (colours, fonts, logo, tone, 3-5 reference reels) and writes docs/wiki/reels/marca.md, receta.md and reels/marca/estilo.json — or skips it in one line when a handoff package already brings marca.md"
      - "Cuts silences and transcribes with editor.py cortar, never touching reels/brutos/, and proposes a plan from the default recipe (resources every 5-8 s, at most two big phrases)"
      - "Shows the contact sheet (hoja.py) and waits for an explicit yes before rendering with componer.py"
      - "Keeps captions in the lower third (never under the chin, above the bottom 13 %), never covers the face, uploads nothing and uses no third-party photos"
      - "Delivers reels/exportados/<clip>_vN.mp4 after checking the stills against the review list, and ends the turn with a question"
