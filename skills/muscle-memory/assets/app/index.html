<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscle Memory — Training Log</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<style>
/* ============================================================
   MUSCLE MEMORY — hoja de estilos unica
   Concepto: un "cuaderno de entrenamiento" (ledger). Fondo en
   papel apagado, tipografia serif solo para titulos (restringida),
   mono para todo lo que es dato/codigo (fechas, editor, consola).
   Acentos funcionales: jade (pasa), ambar (pendiente), teja/sello
   (falla) — nunca un unico acento sobre negro, ni cream+terracota.
   ============================================================ */

:root{
  color-scheme: light;
  --bg: #e8e6de;
  --surface: #fbf9f4;
  --surface-2: #f1eee5;
  --ink: #201d19;
  --ink-soft: #6b655b;
  --ink-faint: #948d80;
  --line: rgba(32,29,25,.14);
  --line-strong: rgba(32,29,25,.24);
  --accent-jade: #1f7a5c;
  --accent-jade-bg: rgba(31,122,92,.12);
  --accent-clay: #9a3324;
  --accent-clay-bg: rgba(154,51,36,.10);
  --accent-amber: #a2711a;
  --accent-amber-bg: rgba(162,113,26,.12);
  --focus: #2a5db0;
  --shadow: 0 1px 2px rgba(32,29,25,.06), 0 8px 24px -12px rgba(32,29,25,.18);

  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, "Courier New", monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg: #15171a;
    --surface: #1c1f23;
    --surface-2: #23262b;
    --ink: #ece7da;
    --ink-soft: #a39c8e;
    --ink-faint: #746e62;
    --line: rgba(236,231,218,.13);
    --line-strong: rgba(236,231,218,.22);
    --accent-jade: #52c299;
    --accent-jade-bg: rgba(82,194,153,.14);
    --accent-clay: #e2836a;
    --accent-clay-bg: rgba(226,131,106,.14);
    --accent-amber: #e0b04e;
    --accent-amber-bg: rgba(224,176,78,.14);
    --focus: #7fb0ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.55);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg: #e8e6de; --surface: #fbf9f4; --surface-2: #f1eee5;
  --ink: #201d19; --ink-soft: #6b655b; --ink-faint: #948d80;
  --line: rgba(32,29,25,.14); --line-strong: rgba(32,29,25,.24);
  --accent-jade: #1f7a5c; --accent-jade-bg: rgba(31,122,92,.12);
  --accent-clay: #9a3324; --accent-clay-bg: rgba(154,51,36,.10);
  --accent-amber: #a2711a; --accent-amber-bg: rgba(162,113,26,.12);
  --focus: #2a5db0;
  --shadow: 0 1px 2px rgba(32,29,25,.06), 0 8px 24px -12px rgba(32,29,25,.18);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg: #15171a; --surface: #1c1f23; --surface-2: #23262b;
  --ink: #ece7da; --ink-soft: #a39c8e; --ink-faint: #746e62;
  --line: rgba(236,231,218,.13); --line-strong: rgba(236,231,218,.22);
  --accent-jade: #52c299; --accent-jade-bg: rgba(82,194,153,.14);
  --accent-clay: #e2836a; --accent-clay-bg: rgba(226,131,106,.14);
  --accent-amber: #e0b04e; --accent-amber-bg: rgba(224,176,78,.14);
  --focus: #7fb0ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.55);
}

*, *::before, *::after{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s ease, color .2s ease;
}
h1,h2,h3,h4{ margin: 0; font-family: var(--font-display); font-weight: 600; }
p{ margin: 0 0 .6em; }
p:last-child{ margin-bottom: 0; }
code, pre{ font-family: var(--font-mono); }
code{ background: var(--surface-2); padding: .1em .35em; border-radius: 4px; font-size: .92em; }
button, input, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
button{ cursor: pointer; }
a{ color: inherit; }
::selection{ background: var(--accent-jade-bg); }

:focus-visible{
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- layout shell ---------- */
.app-shell{
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
.topbar{
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .5rem .9rem;
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 20;
}
@media (max-width: 480px){
  .topbar .tagline{ display: none; }
}
.wordmark{
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: .01em;
  white-space: nowrap;
}
.wordmark .stamp-mark{
  display: inline-block;
  color: var(--accent-jade);
  transform: rotate(-8deg);
  font-family: var(--font-ui);
  font-weight: 800;
}
.tagline{
  font-family: var(--font-mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--ink-faint);
  border-left: 1px solid var(--line-strong);
  padding-left: .9rem;
  white-space: nowrap;
}
.topbar-spacer{ flex: 1; }
.pyodide-status{
  font-family: var(--font-mono);
  font-size: .72rem;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: .4rem;
  white-space: nowrap;
}
.pyodide-status .dot{
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-amber);
  box-shadow: 0 0 0 3px var(--accent-amber-bg);
}
.pyodide-status[data-state="ready"] .dot{ background: var(--accent-jade); box-shadow: 0 0 0 3px var(--accent-jade-bg); }
.pyodide-status[data-state="error"] .dot{ background: var(--accent-clay); box-shadow: 0 0 0 3px var(--accent-clay-bg); }

.icon-btn{
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  color: var(--ink);
  border-radius: var(--radius-sm);
  width: 44px; height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  flex: none;
  transition: background-color .15s ease, transform .1s ease;
}
.icon-btn:hover{ background: var(--bg); }
.icon-btn:active{ transform: scale(.94); }

.mobile-banner{
  display: none;
  align-items: center;
  gap: .6rem;
  padding: .55rem 1.1rem;
  background: var(--accent-amber-bg);
  color: var(--ink);
  font-size: .82rem;
  border-bottom: 1px solid var(--line);
}
.mobile-banner button{
  margin-left: auto;
  background: none; border: none; color: var(--ink-soft);
  font-size: 1rem; line-height: 1; padding: .2rem .4rem;
}
@media (max-width: 640px){
  .mobile-banner.is-active{ display: flex; }
}

main.view{
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 1.6rem 1.25rem 3rem;
}

/* ---------- empty state ---------- */
.empty-state{
  max-width: 460px;
  margin: 8vh auto 0;
  text-align: center;
  padding: 2.4rem 2rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}
.empty-state .mark{
  font-size: 2.2rem;
  margin-bottom: .6rem;
  color: var(--accent-jade);
}
.empty-state h1{ font-size: 1.3rem; margin-bottom: .5rem; }
.empty-state p{ color: var(--ink-soft); }

/* ---------- session list ---------- */
.session-list-head{
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 1.1rem;
  flex-wrap: wrap;
  gap: .5rem;
}
.session-list-head h1{ font-size: 1.15rem; }
.session-list-head .count{
  font-family: var(--font-mono);
  font-size: .74rem;
  color: var(--ink-faint);
}
.sessions{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
.session-row{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: border-color .15s ease;
}
.session-row.is-open{ border-color: var(--line-strong); }
.session-row__head{
  display: flex;
  align-items: center;
  gap: 1rem;
  width: 100%;
  padding: .95rem 1.1rem;
  background: none;
  border: none;
  text-align: left;
  color: inherit;
}
.session-row__head:hover{ background: var(--surface-2); }
.session-date{
  font-family: var(--font-mono);
  font-size: .74rem;
  letter-spacing: .03em;
  color: var(--ink-faint);
  min-width: 6.5rem;
}
.session-meta{ flex: 1; min-width: 0; }
.session-project{
  display: block;
  font-family: var(--font-mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink-faint);
}
.session-title{ font-size: 1.02rem; margin-top: .1rem; }
.session-tally{
  font-family: var(--font-mono);
  font-size: .8rem;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: .5rem;
  flex: none;
}
.tally-dots{ display: inline-flex; gap: 3px; }
.tally-dots i{
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--line-strong);
  display: inline-block;
}
.tally-dots i.filled{ background: var(--accent-jade); }
.chevron{ flex: none; color: var(--ink-faint); transition: transform .15s ease; }
.session-row.is-open .chevron{ transform: rotate(90deg); }

.session-row__body{
  border-top: 1px solid var(--line);
  padding: .8rem 1.1rem 1.1rem;
  display: none;
}
.session-row.is-open .session-row__body{ display: block; }
.kata-quicklist{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.kata-quick-row{
  display: flex;
  align-items: center;
  gap: .7rem;
  width: 100%;
  min-height: 44px;
  padding: .55rem .7rem;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  text-align: left;
  color: inherit;
}
.kata-quick-row:hover{ border-color: var(--line-strong); }
.status-dot{
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--line-strong);
  flex: none;
}
.status-dot.done{ background: var(--accent-jade); }
.kata-quick-title{ flex: 1; font-size: .88rem; }
.kata-quick-tag{
  font-family: var(--font-mono);
  font-size: .68rem;
  color: var(--ink-faint);
  white-space: nowrap;
}

/* ---------- workspace ---------- */
.workspace{
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 1.4rem;
  align-items: start;
}
@media (max-width: 900px){
  .workspace{ grid-template-columns: 1fr; }
}

.kata-nav{
  position: sticky;
  top: 4.4rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
@media (max-width: 900px){
  .kata-nav{ position: static; }
}
.back-link{
  align-self: flex-start;
  background: none; border: none;
  color: var(--ink-soft);
  font-size: .82rem;
  padding: 0;
  display: flex; align-items: center; gap: .3rem;
}
.back-link:hover{ color: var(--ink); }
.workspace-heading .session-project{ font-size: .68rem; }
.workspace-heading h2{ font-size: 1.15rem; margin-top: .15rem; }

.kata-tabs{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
@media (max-width: 900px){
  .kata-tabs{ flex-direction: row; overflow-x: auto; padding-bottom: .3rem; -webkit-overflow-scrolling: touch; }
  .kata-tab{ min-width: 200px; flex: none; }
}
.kata-tab{
  display: flex;
  align-items: center;
  gap: .6rem;
  width: 100%;
  padding: .6rem .7rem;
  border: 1px solid transparent;
  background: none;
  border-radius: var(--radius-sm);
  text-align: left;
  color: inherit;
}
.kata-tab:hover{ background: var(--surface-2); }
.kata-tab.active{ background: var(--surface); border-color: var(--line-strong); box-shadow: var(--shadow); }
.kata-tab-text{ flex: 1; min-width: 0; }
.kata-tab-title{ font-size: .86rem; display: block; }
.kata-tab-sub{ font-family: var(--font-mono); font-size: .68rem; color: var(--ink-faint); }

.session-progress{
  font-family: var(--font-mono);
  font-size: .76rem;
  color: var(--ink-soft);
  padding-top: .6rem;
  border-top: 1px solid var(--line);
}
.session-progress b{ color: var(--ink); }

.kata-main{ display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }

.panel{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  min-width: 0;
}
.spec-card{ padding: 1.1rem 1.3rem; }
.spec-card-head{ display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; margin-bottom: .6rem; }
.spec-card-head h3{ font-size: 1.05rem; }
.badge{
  font-family: var(--font-mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: .2rem .5rem;
  border-radius: 999px;
}
.spec-html{ color: var(--ink); font-size: .95rem; }
.spec-html p{ margin: 0 0 .55em; }
.spec-html code{ font-size: .87em; }
.spec-html ul, .spec-html ol{ margin: 0 0 .55em; padding-left: 1.3em; }

.editor-panel{ overflow: hidden; }
.editor-toolbar{
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .65rem .8rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.btn{
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  color: var(--ink);
  padding: .5rem .85rem;
  min-height: 44px;
  border-radius: var(--radius-sm);
  font-size: .82rem;
  font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  transition: background-color .15s ease, transform .1s ease, opacity .15s ease;
}
.btn:hover:not(:disabled){ background: var(--bg); }
.btn:active:not(:disabled){ transform: scale(.97); }
.btn:disabled{ opacity: .5; cursor: not-allowed; }
.btn-run{ background: var(--accent-jade); border-color: var(--accent-jade); color: #fbf9f4; }
.btn-run:hover:not(:disabled){ filter: brightness(1.06); background: var(--accent-jade); }
.btn-run:disabled{ background: var(--surface-2); border-color: var(--line-strong); color: var(--ink-faint); }
.btn-ghost{ background: none; }
.toolbar-hint{
  font-size: .74rem;
  color: var(--ink-faint);
  margin-left: auto;
  max-width: 220px;
  text-align: right;
}
@media (max-width: 560px){
  .toolbar-hint{ display: none; }
}
#editor-host{ min-width: 0; }
#editor-host .CodeMirror{
  height: auto;
  min-height: 220px;
  max-height: 52vh;
  width: 100%;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: .88rem;
  line-height: 1.55;
  background: var(--surface);
  color: var(--ink);
  padding: .3rem 0;
}
#editor-host .CodeMirror-gutters{ background: var(--surface-2); border-right: 1px solid var(--line); }
#editor-host .CodeMirror-linenumber{ color: var(--ink-faint); }
#editor-host .CodeMirror-cursor{ border-left-color: var(--accent-jade); }
#editor-host .CodeMirror-selected{ background: var(--accent-jade-bg); }
#editor-host .cm-comment{ color: var(--ink-faint); }
#editor-host .cm-keyword{ color: var(--accent-clay); }
#editor-host .cm-def, #editor-host .cm-variable-2{ color: var(--focus); }
#editor-host .cm-string{ color: var(--accent-jade); }
#editor-host .cm-number{ color: var(--accent-amber); }

.console-panel{ padding: 0; }
.console-banner{
  padding: .85rem 1.1rem;
  font-size: .88rem;
  font-weight: 600;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: .6rem;
}
.console-banner .stamp{
  font-family: var(--font-ui);
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  padding: .18rem .5rem;
  border: 2px solid currentColor;
  border-radius: 5px;
  transform: rotate(-6deg);
}
@keyframes stamp-thud{
  0%{ transform: rotate(-6deg) scale(1.9); opacity: 0; }
  60%{ transform: rotate(-6deg) scale(.94); opacity: 1; }
  100%{ transform: rotate(-6deg) scale(1); }
}
.console-banner .stamp.is-fresh{ animation: stamp-thud .32s cubic-bezier(.2,.9,.3,1.2); }
@media (prefers-reduced-motion: reduce){
  .console-banner .stamp.is-fresh{ animation: none; }
}
.console-banner[data-state="idle"]{ color: var(--ink-soft); }
.console-banner[data-state="success"]{ color: var(--accent-jade); background: var(--accent-jade-bg); }
.console-banner[data-state="partial"]{ color: var(--accent-amber); background: var(--accent-amber-bg); }
.console-banner[data-state="fail"], .console-banner[data-state="nocompile"]{ color: var(--accent-clay); background: var(--accent-clay-bg); }

.console-error{
  margin: 0;
  padding: .8rem 1.1rem;
  background: var(--accent-clay-bg);
  color: var(--ink);
  font-size: .78rem;
  white-space: pre-wrap;
  word-break: break-word;
  border-bottom: 1px solid var(--line);
  max-height: 260px;
  overflow: auto;
}
.console-results{ list-style: none; margin: 0; padding: .3rem 0; }
.console-results:empty{ display: none; }
.result-row{
  display: flex;
  gap: .6rem;
  padding: .45rem 1.1rem;
  align-items: flex-start;
  font-size: .83rem;
}
.result-row .glyph{
  font-family: var(--font-mono);
  font-weight: 700;
  flex: none;
  width: 1.1rem;
}
.result-row.ok .glyph{ color: var(--accent-jade); }
.result-row.bad .glyph{ color: var(--accent-clay); }
.result-name{ font-family: var(--font-mono); color: var(--ink); }
.result-error{ display: block; color: var(--ink-soft); margin-top: .1rem; }

.toast{
  position: fixed;
  bottom: 1.2rem;
  left: 50%;
  transform: translate(-50%, 12px);
  background: var(--ink);
  color: var(--bg);
  padding: .55rem 1rem;
  border-radius: 999px;
  font-size: .8rem;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 40;
}
.toast.is-visible{ opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce){
  .toast{ transition: opacity .01s linear; }
}

.visually-hidden{
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
</style>
</head>
<body>
<div class="app-shell">
  <div class="mobile-banner" id="mobile-banner">
    <span>This trains best on a tablet or laptop — the editor is cramped on a phone.</span>
    <button type="button" id="mobile-banner-dismiss" aria-label="Dismiss">&times;</button>
  </div>
  <header class="topbar">
    <span class="wordmark"><span class="stamp-mark">&#10003;</span> Muscle Memory</span>
    <span class="tagline">Training log</span>
    <span class="topbar-spacer"></span>
    <span class="pyodide-status" id="pyodide-status" data-state="loading" role="status" aria-live="polite">
      <span class="dot"></span><span id="pyodide-status-text">Loading Python…</span>
    </span>
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
      <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
  </header>
  <main class="view" id="view-root">
    <!-- rendered by JS -->
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ datos: sesiones (Task 4), sin servidor ============ -->
<script src="../sessions/manifest.js"></script>

<!-- ============ vendor: CodeMirror + Pyodide (CDN, unicas deps externas) ============ -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   Runner Pyodide — codigo exacto de la especificacion. Ejecuta
   el codigo del alumno + los tests, distingue "no compila" de
   "test falla" y devuelve JSON con un resultado por test.
   ============================================================ */
var RUNNER_SRC = [
"import json, traceback, inspect",
"_ns = {}",
"_out = {\"compiles\": True, \"error\": None, \"results\": []}",
"try:",
"    exec(_USER_CODE, _ns)",
"except Exception:",
"    _out[\"compiles\"] = False",
"    _out[\"error\"] = traceback.format_exc()",
"if _out[\"compiles\"]:",
"    try:",
"        exec(_TEST_CODE, _ns)",
"    except Exception:",
"        _out[\"compiles\"] = False",
"        _out[\"error\"] = traceback.format_exc()",
"if _out[\"compiles\"]:",
"    for _n, _f in list(_ns.items()):",
"        if _n.startswith(\"test_\") and callable(_f):",
"            try:",
"                _r = _f()",
"                if inspect.iscoroutine(_r):",
"                    await _r",
"                _out[\"results\"].append({\"name\": _n, \"ok\": True, \"error\": None})",
"            except AssertionError as e:",
"                _out[\"results\"].append({\"name\": _n, \"ok\": False, \"error\": str(e) or \"assert failed\"})",
"            except Exception as e:",
"                _out[\"results\"].append({\"name\": _n, \"ok\": False, \"error\": type(e).__name__ + \": \" + str(e)})",
"json.dumps(_out)"
].join("\n");

/* ---------------- estado global de la app ---------------- */
var state = {
  sessions: [],           // sesiones cargadas, orden = manifest (mas reciente primero)
  view: "loading",        // 'loading' | 'empty' | 'list' | 'workspace'
  openSessionId: null,    // sesion expandida en el selector
  currentSessionId: null,
  currentKataIndex: 0,
  editor: null,           // instancia CodeMirror activa
  pyodide: null,
  pyodideReady: false
};
// expuesto para depuracion manual (no forma parte del contrato de datos)
window.MM = { state: state };

var viewRoot = document.getElementById("view-root");

/* ---------------- persistencia local ---------------- */
function codeKey(sessionId, kataId){ return "mm_code_" + sessionId + "_" + kataId; }
function doneKey(sessionId, kataId){ return sessionId + "_" + kataId; }

function loadCode(sessionId, kataId, fallback){
  try{
    var v = localStorage.getItem(codeKey(sessionId, kataId));
    return v === null ? fallback : v;
  }catch(e){ return fallback; }
}
function saveCode(sessionId, kataId, value){
  try{ localStorage.setItem(codeKey(sessionId, kataId), value); }catch(e){}
}
function clearCode(sessionId, kataId){
  try{ localStorage.removeItem(codeKey(sessionId, kataId)); }catch(e){}
}
function getDoneMap(){
  try{
    var raw = localStorage.getItem("mm_done");
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function setDoneMap(map){
  try{ localStorage.setItem("mm_done", JSON.stringify(map)); }catch(e){}
}
function isDone(sessionId, kataId){ return !!getDoneMap()[doneKey(sessionId, kataId)]; }
function markDone(sessionId, kataId){
  var map = getDoneMap();
  map[doneKey(sessionId, kataId)] = true;
  setDoneMap(map);
}
function clearDone(sessionId, kataId){
  var map = getDoneMap();
  delete map[doneKey(sessionId, kataId)];
  setDoneMap(map);
}
function sessionTally(session){
  var map = getDoneMap();
  var passed = 0;
  session.katas.forEach(function(k){ if (map[doneKey(session.id, k.id)]) passed++; });
  return { passed: passed, total: session.katas.length };
}

/* ---------------- tema ---------------- */
function effectiveTheme(){
  var explicit = null;
  try{ explicit = localStorage.getItem("mm_theme"); }catch(e){}
  if (explicit === "light" || explicit === "dark") return explicit;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function applyThemeIcon(theme){
  var icon = document.getElementById("theme-icon");
  if (!icon) return;
  if (theme === "dark"){
    // luna
    icon.innerHTML = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
  }
}
function initTheme(){
  var stored = null;
  try{ stored = localStorage.getItem("mm_theme"); }catch(e){}
  if (stored === "light" || stored === "dark"){
    document.documentElement.setAttribute("data-theme", stored);
  }
  applyThemeIcon(effectiveTheme());
  document.getElementById("theme-toggle").addEventListener("click", function(){
    var next = effectiveTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("mm_theme", next); }catch(e){}
    applyThemeIcon(next);
    if (state.editor) state.editor.refresh();
  });
}

/* ---------------- aviso movil ---------------- */
function initMobileBanner(){
  var banner = document.getElementById("mobile-banner");
  var dismissed = false;
  function sync(){
    if (dismissed) { banner.classList.remove("is-active"); return; }
    banner.classList.toggle("is-active", window.innerWidth <= 640);
  }
  document.getElementById("mobile-banner-dismiss").addEventListener("click", function(){
    dismissed = true;
    banner.classList.remove("is-active");
  });
  window.addEventListener("resize", sync);
  sync();
}

/* ---------------- toast ---------------- */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("is-visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("is-visible"); }, 2600);
}

/* ---------------- carga de sesiones (sin servidor, file://) ---------------- */
function loadScript(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = src;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error("failed to load " + src)); };
    document.head.appendChild(s);
  });
}

function boot(){
  initTheme();
  initMobileBanner();
  initPyodide();

  var manifest = window.MM_MANIFEST;
  if (!Array.isArray(manifest) || manifest.length === 0){
    renderEmptyState();
    return;
  }
  window.MM_SESSIONS = window.MM_SESSIONS || [];

  // carga secuencial: garantiza que MM_SESSIONS queda en el mismo
  // orden que el manifest (mas reciente primero), sin depender de
  // en que orden resuelva la red cada <script>.
  var chain = Promise.resolve();
  manifest.forEach(function(file){
    chain = chain.then(function(){
      return loadScript("../sessions/" + file).catch(function(err){
        console.warn("[muscle-memory]", err.message);
      });
    });
  });
  chain.then(function(){
    if (!window.MM_SESSIONS || window.MM_SESSIONS.length === 0){
      renderEmptyState();
      return;
    }
    state.sessions = window.MM_SESSIONS;
    state.openSessionId = state.sessions[0].id;
    renderSessionList();
  });
}

/* ---------------- runner pyodide ---------------- */
function setPyodideStatus(mode, text){
  var el = document.getElementById("pyodide-status");
  var txt = document.getElementById("pyodide-status-text");
  el.setAttribute("data-state", mode);
  txt.textContent = text;
}

function initPyodide(){
  setPyodideStatus("loading", "Loading Python…");
  if (typeof loadPyodide !== "function"){
    setPyodideStatus("error", "Python unavailable (offline?)");
    return;
  }
  loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" })
    .then(function(py){
      state.pyodide = py;
      state.pyodideReady = true;
      setPyodideStatus("ready", "Python ready");
      showToast("Python ready — you can Run now.");
      syncRunButton();
    })
    .catch(function(err){
      console.error(err);
      setPyodideStatus("error", "Python failed to load");
    });
}

function syncRunButton(){
  var btn = document.getElementById("run-btn");
  if (!btn) return;
  btn.disabled = !state.pyodideReady;
  btn.textContent = state.pyodideReady ? "Run" : "Loading Python…";
}

function currentSession(){
  return state.sessions.filter(function(s){ return s.id === state.currentSessionId; })[0] || null;
}
function currentKata(){
  var session = currentSession();
  return session ? session.katas[state.currentKataIndex] : null;
}

function runKata(){
  if (!state.pyodideReady || !state.pyodide) return;
  var session = currentSession();
  var kata = currentKata();
  if (!session || !kata) return;

  var btn = document.getElementById("run-btn");
  btn.disabled = true;
  var prevLabel = btn.textContent;
  btn.textContent = "Running…";

  var userCode = state.editor.getValue();
  saveCode(session.id, kata.id, userCode);

  state.pyodide.globals.set("_USER_CODE", userCode);
  state.pyodide.globals.set("_TEST_CODE", kata.test);

  Promise.resolve()
    .then(function(){ return state.pyodide.runPythonAsync(RUNNER_SRC); })
    .then(function(resultJson){
      var result = JSON.parse(resultJson);
      renderResult(session, kata, result);
    })
    .catch(function(err){
      renderResult(session, kata, { compiles: false, error: String(err), results: [] });
    })
    .then(function(){
      btn.disabled = false;
      btn.textContent = prevLabel === "Running…" ? "Run" : prevLabel;
      syncRunButton();
    });
}

function renderResult(session, kata, result){
  var banner = document.getElementById("console-banner");
  var errorBox = document.getElementById("console-error");
  var list = document.getElementById("console-results");
  list.innerHTML = "";

  if (!result.compiles){
    banner.setAttribute("data-state", "nocompile");
    banner.innerHTML = "Does not compile";
    errorBox.style.display = "block";
    errorBox.textContent = result.error || "Unknown error";
    updateTabStatus(session, kata, false);
    return;
  }
  errorBox.style.display = "none";
  errorBox.textContent = "";

  var total = result.results.length;
  var passed = result.results.filter(function(r){ return r.ok; }).length;
  var allGreen = total > 0 && passed === total;

  result.results.forEach(function(r){
    var li = document.createElement("li");
    li.className = "result-row " + (r.ok ? "ok" : "bad");
    var glyph = document.createElement("span");
    glyph.className = "glyph";
    glyph.textContent = r.ok ? "✓" : "✗";
    var body = document.createElement("span");
    var name = document.createElement("span");
    name.className = "result-name";
    name.textContent = r.name;
    body.appendChild(name);
    if (!r.ok && r.error){
      var errSpan = document.createElement("span");
      errSpan.className = "result-error";
      errSpan.textContent = r.error;
      body.appendChild(errSpan);
    }
    li.appendChild(glyph);
    li.appendChild(body);
    list.appendChild(li);
  });

  if (allGreen){
    var wasAlready = isDone(session.id, kata.id);
    markDone(session.id, kata.id);
    banner.setAttribute("data-state", "success");
    banner.innerHTML = "All green — " + passed + " of " + total +
      " <span class=\"stamp" + (wasAlready ? "" : " is-fresh") + "\">Passed</span>";
    if (!wasAlready) showToast("Kata passed. Nicely done.");
  } else if (passed === 0){
    banner.setAttribute("data-state", "fail");
    banner.textContent = "0 of " + total + " passing";
  } else {
    banner.setAttribute("data-state", "partial");
    banner.textContent = passed + " of " + total + " passing";
  }
  updateTabStatus(session, kata, allGreen);
}

function updateTabStatus(session, kata, passedNow){
  // refresca puntitos de estado sin re-renderizar todo el workspace
  var tab = document.querySelector('.kata-tab[data-kata-id="' + kata.id + '"] .status-dot');
  if (tab) tab.classList.toggle("done", isDone(session.id, kata.id));
  var progress = document.getElementById("session-progress");
  if (progress){
    var tally = sessionTally(session);
    progress.innerHTML = "<b>" + tally.passed + "</b> of " + tally.total + " katas passed";
  }
}

/* ---------------- render: estado vacio ---------------- */
function renderEmptyState(){
  state.view = "empty";
  viewRoot.innerHTML =
    '<div class="empty-state">' +
      '<div class="mark">&#9679;</div>' +
      '<h1>No sessions yet</h1>' +
      '<p>No sessions yet — ask Claude for a training session.</p>' +
    '</div>';
}

/* ---------------- render: selector de sesiones ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
  });
}

function renderSessionList(){
  state.view = "list";
  var totalKatas = 0, totalPassed = 0;
  state.sessions.forEach(function(s){
    var t = sessionTally(s);
    totalKatas += t.total; totalPassed += t.passed;
  });

  var rows = state.sessions.map(function(session){
    var tally = sessionTally(session);
    var isOpen = session.id === state.openSessionId;
    var dots = session.katas.map(function(k){
      return '<i class="' + (isDone(session.id, k.id) ? "filled" : "") + '"></i>';
    }).join("");
    var quickRows = session.katas.map(function(k, idx){
      return '<button type="button" class="kata-quick-row" data-session="' + escapeHtml(session.id) +
        '" data-index="' + idx + '">' +
        '<span class="status-dot ' + (isDone(session.id, k.id) ? "done" : "") + '"></span>' +
        '<span class="kata-quick-title">' + escapeHtml(k.title) + (isDone(session.id, k.id) ? " &#10003;" : "") + '</span>' +
        '<span class="kata-quick-tag">' + escapeHtml(k.concept) + " &middot; N" + escapeHtml(k.level) + '</span>' +
        '</button>';
    }).join("");

    return '<li class="session-row ' + (isOpen ? "is-open" : "") + '" data-session-id="' + escapeHtml(session.id) + '">' +
      '<button type="button" class="session-row__head" data-toggle-session="' + escapeHtml(session.id) + '" aria-expanded="' + isOpen + '">' +
        '<span class="session-date">' + escapeHtml(session.date) + '</span>' +
        '<span class="session-meta">' +
          '<span class="session-project">' + escapeHtml(session.project) + '</span>' +
          '<h2 class="session-title">' + escapeHtml(session.title) + '</h2>' +
        '</span>' +
        '<span class="session-tally">' + tally.passed + '/' + tally.total + '<span class="tally-dots">' + dots + '</span></span>' +
        '<span class="chevron">&#8250;</span>' +
      '</button>' +
      '<div class="session-row__body">' +
        '<ul class="kata-quicklist">' + quickRows + '</ul>' +
      '</div>' +
    '</li>';
  }).join("");

  viewRoot.innerHTML =
    '<div class="session-list-head">' +
      '<h1>Training sessions</h1>' +
      '<span class="count">' + totalPassed + ' / ' + totalKatas + ' katas passed overall</span>' +
    '</div>' +
    '<ul class="sessions">' + rows + '</ul>';

  viewRoot.querySelectorAll("[data-toggle-session]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-toggle-session");
      state.openSessionId = (state.openSessionId === id) ? null : id;
      renderSessionList();
    });
  });
  viewRoot.querySelectorAll(".kata-quick-row").forEach(function(btn){
    btn.addEventListener("click", function(){
      openWorkspace(btn.getAttribute("data-session"), parseInt(btn.getAttribute("data-index"), 10));
    });
  });
}

/* ---------------- render: workspace de una kata ---------------- */
function openWorkspace(sessionId, kataIndex){
  state.currentSessionId = sessionId;
  state.currentKataIndex = kataIndex;
  renderWorkspace();
}

function renderWorkspace(){
  state.view = "workspace";
  var session = currentSession();
  var kata = currentKata();
  if (!session || !kata){ renderSessionList(); return; }

  var tabs = session.katas.map(function(k, idx){
    return '<li>' +
      '<button type="button" class="kata-tab ' + (idx === state.currentKataIndex ? "active" : "") + '" ' +
        'data-kata-index="' + idx + '" data-kata-id="' + escapeHtml(k.id) + '">' +
        '<span class="status-dot ' + (isDone(session.id, k.id) ? "done" : "") + '"></span>' +
        '<span class="kata-tab-text">' +
          '<span class="kata-tab-title">' + escapeHtml(k.title) + '</span>' +
          '<span class="kata-tab-sub">' + escapeHtml(k.concept) + " &middot; N" + escapeHtml(k.level) + '</span>' +
        '</span>' +
      '</button>' +
    '</li>';
  }).join("");

  var tally = sessionTally(session);

  viewRoot.innerHTML =
    '<div class="workspace">' +
      '<aside class="kata-nav">' +
        '<button type="button" class="back-link" id="back-to-list">&#8249; All sessions</button>' +
        '<div class="workspace-heading">' +
          '<span class="session-project">' + escapeHtml(session.project) + " &middot; " + escapeHtml(session.date) + '</span>' +
          '<h2>' + escapeHtml(session.title) + '</h2>' +
        '</div>' +
        '<ol class="kata-tabs">' + tabs + '</ol>' +
        '<div class="session-progress" id="session-progress"><b>' + tally.passed + '</b> of ' + tally.total + ' katas passed</div>' +
      '</aside>' +
      '<main class="kata-main">' +
        '<section class="panel spec-card">' +
          '<div class="spec-card-head">' +
            '<h3>' + escapeHtml(kata.title) + '</h3>' +
            '<span class="badge">' + escapeHtml(kata.concept) + " &middot; level " + escapeHtml(kata.level) + '</span>' +
          '</div>' +
          '<div class="spec-html">' + kata.spec_html + '</div>' +
        '</section>' +
        '<section class="panel editor-panel">' +
          '<div class="editor-toolbar">' +
            '<button type="button" class="btn btn-run" id="run-btn" disabled>Loading Python…</button>' +
            '<button type="button" class="btn btn-ghost" id="download-btn">Download solution</button>' +
            '<button type="button" class="btn btn-ghost" id="reset-btn">Reset</button>' +
            '<span class="toolbar-hint">Save downloads to this project\'s <code>muscle-memory/solutions/</code> folder and ask Claude for a review.</span>' +
          '</div>' +
          '<div id="editor-host"></div>' +
        '</section>' +
        '<section class="panel console-panel">' +
          '<div class="console-banner" id="console-banner" data-state="idle" role="status" aria-live="polite">Run to check your solution.</div>' +
          '<pre class="console-error" id="console-error" style="display:none"></pre>' +
          '<ul class="console-results" id="console-results"></ul>' +
        '</section>' +
      '</main>' +
    '</div>';

  document.getElementById("back-to-list").addEventListener("click", function(){
    state.openSessionId = session.id;
    renderSessionList();
  });
  viewRoot.querySelectorAll(".kata-tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.currentKataIndex = parseInt(btn.getAttribute("data-kata-index"), 10);
      renderWorkspace();
    });
  });
  document.getElementById("run-btn").addEventListener("click", runKata);
  document.getElementById("download-btn").addEventListener("click", function(){ downloadSolution(session, kata); });
  document.getElementById("reset-btn").addEventListener("click", function(){ resetKata(session, kata); });

  mountEditor(session, kata);
  syncRunButton();
}

function mountEditor(session, kata){
  var host = document.getElementById("editor-host");
  host.innerHTML = "";
  var textarea = document.createElement("textarea");
  host.appendChild(textarea);
  var initial = loadCode(session.id, kata.id, kata.stub);
  state.editor = CodeMirror.fromTextArea(textarea, {
    mode: "python",
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    value: initial
  });
  state.editor.setValue(initial);
  state.editor.on("change", function(){
    saveCode(session.id, kata.id, state.editor.getValue());
  });
}

function resetKata(session, kata){
  var ok = window.confirm("Reset this kata back to its starting stub? Your current code and pass mark for it will be lost.");
  if (!ok) return;
  clearCode(session.id, kata.id);
  clearDone(session.id, kata.id);
  state.editor.setValue(kata.stub);
  var banner = document.getElementById("console-banner");
  banner.setAttribute("data-state", "idle");
  banner.textContent = "Run to check your solution.";
  document.getElementById("console-error").style.display = "none";
  document.getElementById("console-results").innerHTML = "";
  updateTabStatus(session, kata, false);
}

function downloadSolution(session, kata){
  var code = state.editor.getValue();
  var today = new Date().toISOString().slice(0, 10);
  var header = [
    "# Kata: " + kata.title,
    "# Concept: " + kata.concept + " (level " + kata.level + ")",
    "# Session: " + session.id + " (" + session.date + ")",
    "# Downloaded: " + today,
    "",
    ""
  ].join("\n");
  var blob = new Blob([header + code], { type: "text/plain" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = kata.id + "_solution.py";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

document.addEventListener("DOMContentLoaded", boot);
})();
</script>
