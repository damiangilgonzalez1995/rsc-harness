    why: "Direct trigger for pick-ui-library."
  - prompt: "Pick a library for animated numbers."
    why: "Direct trigger for pick-ui-library."
  - prompt: "What do you recommend for a command menu?"
    why: "Direct trigger for pick-ui-library."
  - prompt: "I need virtualization for a long list; which package?"
    why: "Direct trigger for pick-ui-library."
