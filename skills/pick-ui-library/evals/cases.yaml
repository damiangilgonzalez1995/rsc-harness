    route_to: "ask-sonner"
    why: "Outside the scope of pick-ui-library."
  - prompt: "Design the dashboard layout."
    route_to: "mejor-layout"
    why: "Outside the scope of pick-ui-library."
  - prompt: "Structure my component state."
    route_to: "ui-engineering"
    why: "Outside the scope of pick-ui-library."
  - prompt: "Write a database schema."
    route_to: "none"
    why: "Outside the scope of pick-ui-library."

capability:
