skill: improve-animations

should_trigger:
  - prompt: "Audit all the animations in this codebase."
    why: "Direct trigger for improve-animations."
  - prompt: "Survey our motion code and give me a prioritized plan."
    why: "Direct trigger for improve-animations."
  - prompt: "Where is our animation weakest across the app?"
    why: "Direct trigger for improve-animations."
  - prompt: "Produce an improvement plan for the whole product motion."
    why: "Direct trigger for improve-animations."
  - prompt: "Do a motion audit of the project."
    why: "Direct trigger for improve-animations."

should_not_trigger:
  - prompt: "Review the animation in this one diff."
    route_to: "review-animations"
    why: "Outside the scope of improve-animations."
  - prompt: "Animate this dropdown."
    route_to: "animar"
    why: "Outside the scope of improve-animations."
  - prompt: "Find places where we should add motion."
    route_to: "find-animation-opportunities"
    why: "Outside the scope of improve-animations."
  - prompt: "Fix a janky scroll animation."
    route_to: "animation-performance"
    why: "Outside the scope of improve-animations."

capability:
  - scenario: "A user asks for a codebase-wide motion audit."
    must_include:
      - "plan"
      - "priorit"
