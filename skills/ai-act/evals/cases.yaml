skill: ai-act

should_trigger:
  - prompt: "Estamos montando un chatbot de atencion al cliente sobre un LLM por API. Que nos exige el reglamento europeo de IA?"
    why: "Caso central: producto con IA, pide obligaciones. Rol (proveedor posterior), art. 50 y calendario."
  - prompt: "Nuestra app filtra curriculums con un modelo. Es de alto riesgo segun el AI Act?"
    why: "Clasificacion de riesgo de un producto concreto: anexo III, punto 4, y filtro del art. 6.3."
  - prompt: "We only call a model through an API. Are we a provider or a deployer under the EU AI Act?"
    why: "Clasificacion de rol; en ingles; no nombra documentos ni auditoria."
  - prompt: "Genera el esqueleto de la documentacion tecnica del anexo IV para este proyecto."
    why: "Rama de documentacion: plantilla del anexo IV rellenada desde el repo."
  - prompt: "Tenemos que avisar al usuario de que habla con una IA? Revisa el front del chat."
    why: "No obvio: no nombra la norma, pero es el art. 50.1 y pide revisar codigo."
  - prompt: "Revisa el repo contra la normativa europea de IA: logs, retencion y supervision humana."
    why: "Rama de revision por zonas con hallazgos y ruta de fichero."
  - prompt: "Somos una aseguradora y vamos a desplegar un modelo de scoring para seguros de salud. Necesitamos la FRIA."
    why: "Rama de FRIA (art. 27) para un responsable del despliegue."

should_not_trigger:
  - prompt: "Que marcos de cumplimiento nos obligan (SOC 2, ISO 27001, DORA) y como montamos el registro de controles?"
    route_to: "compliance"
    why: "Alcance de marcos y registro de controles del negocio, no clasificar un producto con IA."
  - prompt: "Haz un hardening del producto y dame los fallos de seguridad por gravedad."
    route_to: "hardening"
    why: "Auditoria de seguridad y privacidad por zonas contra SOC 2 e ISO, no el Reglamento de IA."
  - prompt: "Escribe el calendario de retencion de datos y el ROPA de la empresa."
    route_to: "data-policy"
    why: "Artefactos internos de gobierno del dato; ai-act solo revisa si el codigo los aplica."
  - prompt: "Redacta la politica de privacidad y el banner de cookies de la web."
    route_to: "gdpr-privacy"
    why: "Documentos del RGPD que se publican."
  - prompt: "Add an AI transparency clause to our Terms of Service."
    route_to: "terms-conditions"
    why: "Texto legal de los terminos; el aviso en la interfaz si seria de ai-act."
  - prompt: "Pon limites de coste y aprobacion humana a las herramientas de nuestro agente."
    route_to: "agent-safety"
    why: "Acotar un agente en ejecucion, sin pregunta normativa."

capability:
  - scenario: "Una startup de tres personas tiene un asistente de RR. HH. en produccion desde marzo de 2026: un chat sobre un LLM por API que responde dudas de empleados y, desde hace poco, ordena candidaturas para los reclutadores. Preguntan que les exige la normativa europea y piden revisar el repositorio."
    must_include:
      - "Dice al empezar que no es asesoria juridica y que cumple quien despliega, no la plantilla ni la skill"
      - "Clasifica el rol como proveedor posterior de un sistema (art. 3.68), no proveedor del modelo, y avisa del art. 25.1.c por ordenar candidaturas"
      - "Senala que ordenar candidaturas entra en el anexo III (empleo), que si el sistema elabora perfiles de personas no cabe el filtro del art. 6.3, y que esa decision la firma un especialista"
      - "Separa lo ya exigible (arts. 4 y 50, RGPD) de lo que solo toca por alto riesgo (arts. 9 a 15, logs de al menos seis meses, supervision humana)"
      - "Da el alto riesgo del anexo III desde el 2.12.2027 por el Reglamento (UE) 2026/1744, no desde el 2.8.2026, y el art. 50 como vigente desde el 2.8.2026"
      - "Menciona que el sistema ya estaba en el mercado antes del 2.8.2026 y la gracia del art. 50.2 hasta el 2.12.2026, que no cubre el aviso del 50.1"
      - "Recomprueba las fechas en EUR-Lex o en el AI Act Service Desk, o dice expresamente que no pudo y las da como verificadas a 2026-11-21"
      - "Entrega hallazgos con evidencia fichero:linea, articulo y caracter (exigible ya, solo alto riesgo, buena practica), y deja al usuario decidir que se arregla"
