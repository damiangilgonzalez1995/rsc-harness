skill: research

should_trigger:
  - prompt: "Investiga como funciona esta API de terceros antes de integrarla."
    why: "Disparador directo de research."
  - prompt: "Necesito que alguien lea la documentacion oficial y me resuma los hechos."
    why: "Disparador directo de research."
  - prompt: "Delega esta investigacion a un agente en segundo plano."
    why: "Disparador directo de research."
  - prompt: "Research this topic against primary sources and write up the findings."
    why: "Disparador directo de research."
  - prompt: "Reune hechos verificados sobre esta libreria antes de decidir."
    why: "Disparador directo de research."

should_not_trigger:
  - prompt: "Implementa la funcion que ya investigamos."
    route_to: "none"
    why: "Fuera del alcance de research."
  - prompt: "Escribe un ticket con lo que se va a hacer."
    route_to: "none"
    why: "Fuera del alcance de research."
  - prompt: "Revisa el codigo que hemos escrito hoy."
    route_to: "none"
    why: "Fuera del alcance de research."
  - prompt: "Genera un prototipo de la pantalla."
    route_to: "none"
    why: "Fuera del alcance de research."

capability:
  - scenario: "El usuario quiere investigar un tema contra fuentes primarias."
    must_include:
      - "fuente"
