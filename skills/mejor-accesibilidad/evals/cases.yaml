skill: mejor-accesibilidad

should_trigger:
  - prompt: "Revisa que este formulario cumple accesibilidad."
    why: "Disparador directo de mejor-accesibilidad."
  - prompt: "Necesito soporte completo de teclado en este componente."
    why: "Disparador directo de mejor-accesibilidad."
  - prompt: "Comprueba que los errores se anuncian correctamente a lectores de pantalla."
    why: "Disparador directo de mejor-accesibilidad."
  - prompt: "Make sure this modal traps focus and has accessible names."
    why: "Disparador directo de mejor-accesibilidad."
  - prompt: "Ajusta los anillos de foco de este boton."
    why: "Disparador directo de mejor-accesibilidad."

should_not_trigger:
  - prompt: "Elige la paleta de colores de la marca."
    route_to: "mejor-colores"
    why: "Elegir la paleta de colores es el trabajo de mejor-colores, no de mejor-accesibilidad."
  - prompt: "Escribe el copy del boton de enviar."
    route_to: "mejor-redaccion"
    why: "Escribir el copy de un boton es el trabajo de mejor-redaccion, no de mejor-accesibilidad."
  - prompt: "Anade una animacion al icono del menu."
    route_to: "animar"
    why: "Anadir una animacion es el trabajo de animar, no de mejor-accesibilidad."
  - prompt: "Revisa el layout responsive de esta pagina."
    route_to: "mejor-layout"
    why: "Revisar el layout responsive es el trabajo de mejor-layout, no de mejor-accesibilidad."

capability:
  - scenario: "El usuario quiere que el proyecto cumpla estandares de accesibilidad."
    must_include:
      - "teclado"
