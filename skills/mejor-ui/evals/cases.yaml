skill: mejor-ui

should_trigger:
  - prompt: "Pule los radios de borde y las sombras de esta tarjeta."
    why: "Disparador directo de mejor-ui."
  - prompt: "Necesito animaciones interrumpibles en este boton."
    why: "Disparador directo de mejor-ui."
  - prompt: "Ajusta la escala al pulsar de estos elementos interactivos."
    why: "Disparador directo de mejor-ui."
  - prompt: "Polish this component's optical alignment and surface depth."
    why: "Disparador directo de mejor-ui."
  - prompt: "Suprime las transiciones raras al cambiar de tema."
    why: "Disparador directo de mejor-ui."

should_not_trigger:
  - prompt: "Escribe el copy de este mensaje de error."
    route_to: "mejor-redaccion"
    why: "Escribir el copy de un mensaje de error es el trabajo de mejor-redaccion, no de mejor-ui."
  - prompt: "Genera la paleta de colores del sistema."
    route_to: "mejor-colores"
    why: "Generar la paleta de colores es el trabajo de mejor-colores, no de mejor-ui."
  - prompt: "Revisa el contraste de este texto."
    route_to: "mejor-colores"
    why: "Medir el contraste es el trabajo de mejor-colores, no de mejor-ui."
  - prompt: "Documenta el modelo de dominio."
    route_to: "domain-modeling"
    why: "Documentar el modelo de dominio es el trabajo de domain-modeling, no de mejor-ui."

capability:
  - scenario: "El usuario quiere pulir y mejorar la UI de un proyecto."
    must_include:
      - "pule"
