skill: implement

should_trigger:
  - prompt: "Implementa esta pieza de trabajo a partir de la spec."
    why: "Disparador directo de implement."
  - prompt: "Coge este conjunto de tickets y empieza a implementarlos."
    why: "Disparador directo de implement."
  - prompt: "Necesito que se escriba el codigo de esta spec."
    why: "Disparador directo de implement."
  - prompt: "Implement this piece of work from the spec we just wrote."
    why: "Disparador directo de implement."
  - prompt: "Pon en marcha la implementacion de este ticket."
    why: "Disparador directo de implement."

should_not_trigger:
  - prompt: "Escribe la spec antes de implementar nada."
    route_to: "to-spec"
    why: "Escribir la spec es el trabajo de to-spec, no de implement."
  - prompt: "Revisa el codigo que ya se implemento."
    route_to: "code-review"
    why: "Revisar el codigo ya implementado es el trabajo de code-review, no de implement."
  - prompt: "Descompon el plan en tickets primero."
    route_to: "to-tickets"
    why: "Descomponer el plan en tickets es el trabajo de to-tickets, no de implement."
  - prompt: "Documenta la decision de arquitectura tomada."
    route_to: "write-adr"
    why: "Documentar una decision de arquitectura es el trabajo de write-adr, no de implement."

capability:
  - scenario: "El usuario quiere implementar una pieza de trabajo a partir de una spec o tickets."
    must_include:
      - "implementa"
