skill: revision-interfaz

should_trigger:
  - prompt: "Haz una revision completa de esta interfaz: accesibilidad, layout, color y texto."
    why: "Disparador directo de revision-interfaz."
  - prompt: "Necesito un veredicto unico ordenado por impacto sobre esta pantalla."
    why: "Disparador directo de revision-interfaz."
  - prompt: "Revisa toda la UI de esta pagina con todas las skills mejor-*."
    why: "Disparador directo de revision-interfaz."
  - prompt: "Run a full interface review covering accessibility, layout, copy, typography and color."
    why: "Disparador directo de revision-interfaz."
  - prompt: "Consolida los hallazgos de diseno de esta pantalla en un solo informe."
    why: "Disparador directo de revision-interfaz."

should_not_trigger:
  - prompt: "Revisa solo el diff de un PR concreto."
    route_to: "revision-de-cambios"
    why: "Revisar el diff de un PR concreto es el trabajo de revision-de-cambios, no de revision-interfaz."
  - prompt: "Implementa la funcionalidad de esta pantalla."
    route_to: "implement"
    why: "Implementar la funcionalidad es el trabajo de implement, no de revision-interfaz."
  - prompt: "Escribe el copy de un solo boton."
    route_to: "mejor-redaccion"
    why: "Escribir el copy de un boton es el trabajo de mejor-redaccion, no de revision-interfaz."
  - prompt: "Genera la paleta de colores desde cero."
    route_to: "mejor-colores"
    why: "Generar la paleta de colores es el trabajo de mejor-colores, no de revision-interfaz."

capability:
  - scenario: "El usuario quiere una revision de interfaz completa y consolidada."
    must_include:
      - "veredicto"
