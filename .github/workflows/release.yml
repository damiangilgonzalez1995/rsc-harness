name: release

# Publishes @damiangilgonzalez/harness to npm with a new version on every push to main.
# Manual runs (workflow_dispatch) let you pick patch / minor / major.
#
# Nothing is committed back to main (it is protected), so there is no publish loop to
# guard against: package.json on main keeps the last version set by hand, and npm plus
# the git tags record what was released.
#
# Requires repo secret NPM_TOKEN (npm token with publish rights).
#
# After publishing to npm it also cuts a GitHub Release for the new tag, with
# notes auto-generated from the commits/PRs since the previous tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # push the version-bump commit + tag
  id-token: write      # npm provenance via OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # --- gates: never publish a broken catalog -------------------------------
      - name: validate frontmatter + recommends
        run: npm run validate
      - name: manifest is current
        run: npm run manifest:check
      - name: tests
        run: npm test
      - name: eval-lint
        run: bash scripts/eval-lint.sh
      - name: originality
        run: npm run originality:check

      # --- version (auto-patch on push; chosen bump on manual run) ---------------
      # main is protected: nothing lands there without a PR, and a personal repo cannot exempt
      # GitHub Actions. So the version is computed inside the runner and never committed back:
      # npm is the source of truth for "what is already released", and the tag records which
      # commit of main each version was built from.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Compute version from the registry
        id: bump
        run: |
          PUBLISHED="$(npm view @damiangilgonzalez/harness version 2>/dev/null || echo 0.0.0)"
          LOCAL="$(node -p "require('./package.json').version")"
          HIGHEST="$(printf '%s\n%s\n' "$PUBLISHED" "$LOCAL" | sort -V | tail -1)"
          echo "published=$PUBLISHED local=$LOCAL highest=$HIGHEST"
          # The `version` script regenerates manifest.json, so the tarball carries the new version.
          npm version "$HIGHEST" --no-git-tag-version --allow-same-version
          npm version "${{ github.event.inputs.bump || 'patch' }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --- publish + tag ---------------------------------------------------------
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Tags are outside the branch ruleset, so this push is allowed.
      - name: Tag the released commit
        run: |
          V="v${{ steps.bump.outputs.version }}"
          git tag -a "$V" "$GITHUB_SHA" -m "🔖 chore(release): ${{ steps.bump.outputs.version }}"
          git push origin "$V"

      # --- cut a GitHub Release for the new tag --------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
